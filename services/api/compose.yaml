services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_DB: ksv_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ksv-local-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ksv_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
