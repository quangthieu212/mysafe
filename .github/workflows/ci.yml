name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_DB: ksv_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ksv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ksv_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ksv_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ksv_test
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run project checks
        run: npm run check

      - name: Install backend dependencies
        run: npm ci --prefix services/api --ignore-scripts

      - name: Audit backend dependencies
        run: npm audit --prefix services/api --audit-level=high

      - name: Apply PostgreSQL migrations
        run: npm run migrate --prefix services/api

      - name: Check backend and PostgreSQL isolation
        run: npm run check --prefix services/api

  attest:
    name: Build, generate SBOM, and attest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build application
        run: npm run build

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist
          npm sbom --sbom-format=cyclonedx > dist/ksv-sbom.cdx.json

      - name: Package build output
        run: tar -czf dist/ksv-next-build.tar.gz .next public next.config.ts package.json package-lock.json

      - name: Upload build and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksv-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attest build and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ksv-next-build.tar.gz

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ksv-next-build.tar.gz
          sbom-path: dist/ksv-sbom.cdx.json
