version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "08:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
